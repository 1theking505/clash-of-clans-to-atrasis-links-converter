<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atrasis Link Converter</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #10b981;
      --warn: #f59e0b;
      --danger: #ef4444;
      --border: #334155;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    h1 { font-size: 1.25rem; margin: 0 0 6px; }
    p.sub { color: var(--muted); font-size: 0.85rem; margin: 0 0 18px; }
    .server-toggle {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .server-toggle button {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--muted);
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .server-toggle button.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
    textarea {
      width: 100%;
      height: 88px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      font-size: 0.85rem;
      resize: none;
      margin-bottom: 12px;
      word-break: break-all;
    }
    textarea:focus { outline: none; border-color: var(--accent); }
    .btn-row { display: flex; gap: 10px; margin-bottom: 16px; }
    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: inline-block;
    }
    .btn-secondary { background: #334155; color: #fff; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-success { background: var(--success); color: #064e3b; }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 6px;
      background: #334155;
      color: #e2e8f0;
      margin-bottom: 8px;
    }
    .badge.warn { background: var(--warn); color: #1f1300; }
    .hidden { display: none; }
    .debug {
      margin-top: 14px;
      padding: 12px;
      border: 1px dashed var(--border);
      border-radius: 10px;
      background: rgba(15,23,42,0.6);
      font-size: 0.78rem;
      color: var(--muted);
      word-break: break-all;
    }
    .debug h4 { margin: 0 0 8px; color: var(--text); font-size: 0.8rem; font-weight: 600; }
    .debug code {
      display: block;
      color: #e2e8f0;
      background: var(--bg);
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 8px;
      word-break: break-all;
      white-space: pre-wrap;
    }
    .id-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .id-chip {
      font-size: 0.72rem;
      padding: 2px 7px;
      border-radius: 5px;
      background: #334155;
      color: #e2e8f0;
    }
    .id-chip.warn { background: var(--danger); color: #fff; }
    .hint {
      margin-top: 10px;
      font-size: 0.78rem;
      color: var(--warn);
      line-height: 1.4;
    }
  
    /* ARMY REMAP DIAGNOSTICS V1 */
    .army-report {
      margin-top: 12px;
      text-align: left;
      font-size: 0.82rem;
      line-height: 1.5;
    }

    .army-report h4 {
      margin: 0 0 12px;
      font-size: 1rem;
    }

    .army-meta {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 5px 12px;
      padding: 10px;
      margin-bottom: 12px;
      border-radius: 8px;
      background: rgba(127,127,127,.10);
      overflow-wrap: anywhere;
    }

    .army-warnings, .army-success {
      padding: 10px;
      border-radius: 8px;
      margin: 10px 0;
      background: rgba(127,127,127,.10);
    }

    .army-warnings { color: var(--warn); }
    .army-success { color: var(--success); }

    .army-warnings ul {
      padding-left: 20px;
      margin: 5px 0 0;
    }

    .army-table-wrap {
      overflow-x: auto;
      margin: 10px 0;
    }

    .army-table {
      width: 100%;
      border-collapse: collapse;
      font-size: .76rem;
      text-align: left;
    }

    .army-table th, .army-table td {
      padding: 7px 8px;
      border-bottom: 1px solid rgba(127,127,127,.22);
      vertical-align: top;
      overflow-wrap: anywhere;
    }

    .army-table th {
      font-weight: 700;
      background: rgba(127,127,127,.12);
    }

    .army-status-good {
      color: var(--success);
      font-weight: 600;
    }

    .army-status-warn {
      color: var(--warn);
      font-weight: 600;
    }

    .army-report details {
      margin-top: 9px;
      padding: 8px;
      background: rgba(127,127,127,.09);
      border-radius: 7px;
    }

    .army-report summary {
      cursor: pointer;
      font-weight: 600;
    }

    .army-report details code {
      display: block;
      margin-top: 8px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      font-size: .72rem;
    }

    @media (max-width: 520px) {
      .army-meta { grid-template-columns: 1fr; }
    }
    

/* FULL-WIDTH LAYOUT OVERRIDE V1 */
html, body {
    width: 100% !important;
    min-height: 100% !important;
    margin: 0 !important;
}

*, *::before, *::after {
    box-sizing: border-box;
}

body {
    min-height: 100vh !important;
    padding: clamp(10px, 1.3vw, 24px) !important;
    overflow-x: hidden;
}

/* Remove the common fixed-width page wrappers. */
body > div:first-of-type,
body > main:first-of-type,
body > .container,
body > .wrapper,
body > #app,
body > #root,
#app,
#root,
.container,
.wrapper,
.app,
.app-container,
.main-container,
.page-container,
.content-container {
    width: 100% !important;
    max-width: none !important;
    margin-left: auto !important;
    margin-right: auto !important;
}

/* Let the controls use the available width. */
textarea,
input,
select,
.output,
.input,
.input-group,
.output-group {
    max-width: 100%;
}

/* Avoid oversized controls overflowing on smaller screens. */
@media (max-width: 700px) {
    body {
        padding: 10px !important;
    }
}
/* END FULL-WIDTH LAYOUT OVERRIDE V1 */

</style>

    let lastArmyAnalysis = null;

    function setServer(server) {
      targetServer = server;
      document.getElementById('btnUltimate').classList.toggle('active', server === 'ultimate');
      document.getElementById('btnOriginal').classList.toggle('active', server === 'original');
      convert();
    }

    // Strip zero-width chars, NBSP, newlines, tabs, and stray control chars
    // that chat apps / word processors love to insert when copying.
    function sanitizeInput(s) {
      return s
        .replace(/[\u200B-\u200D\uFEFF\u00A0]/g, '')
        .replace(/[\r\n\t]+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function parseLink(raw) {
      const cleaned = sanitizeInput(raw);
      const actionIdx = cleaned.indexOf('action=');
      if (actionIdx === -1) return { error: 'No "action=" found in the pasted text.' };

      // Take everything from action= onwards, drop URL fragments.
      let q = cleaned.substring(actionIdx);
      const hashIdx = q.indexOf('#');
      if (hashIdx !== -1) q = q.substring(0, hashIdx);

      // Strip any trailing junk after the query (e.g. whitespace, stray text).
      // The query string only contains [A-Za-z0-9&_=%-].
      q = q.match(/^[A-Za-z0-9&_=%\-]+/);
      if (!q) return { error: 'Could not parse the query string.' };
      q = q[0];

      let params;
      try {
        params = new URLSearchParams(q);
      } catch (e) {
        return { error: 'Malformed query string.' };
      }

      const action = params.get('action');
      if (!action) return { error: 'No action parameter found.' };

      if (action === 'CopyArmy') {
        const army = (params.get('army') || '').trim();
        if (!army) return { error: 'CopyArmy link has no army parameter.' };
        // Army codes only use [A-Za-z0-9_-]. Strip anything else defensively.
        const cleanArmy = army.replace(/[^A-Za-z0-9_\-]/g, '');
        return { action: 'CopyArmy', army: cleanArmy, type: 'army', sourceGame: detectSourceGame(cleaned) };
      }

      if (action === 'OpenLayout') {
        const id = params.get('id');
        if (!id) return { error: 'OpenLayout link has no id parameter.' };
        // Preserve any other layout params (title, etc.).
        const extras = {};
        for (const [k, v] of params.entries()) {
          if (k !== 'action' && k !== 'id') extras[k] = v;
        }
        return { action: 'OpenLayout', id, extras, type: 'layout' };
      }

      return { action, type: 'unknown', params };
    }


    // ARMY REMAP DIAGNOSTICS V1

    function detectSourceGame(value) {
      if (/link\.clashofclans\.com|clashofclans:\/\//i.test(value))
        return 'coc';

      if (/link\.ultimate\.atrasis\.cc|atrasis-ultimate:/i.test(value))
        return 'ultimate';

      if (/link\.original\.atrasis\.cc|atrasis-original:/i.test(value))
        return 'atrasisOriginal';

      return 'unknown';
    }

    function escapeArmyHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[ch]);
    }

    function getArmyObject(gameDb, category, id) {
      return gameDb?.[category]?.[String(id)] || null;
    }


    function mapArmyObject(category, id, sourceDb, targetDb, canRemap) {
      const source = getArmyObject(sourceDb, category, id);

      // Never access properties of a missing source record.
      if (!source || typeof source !== 'object') {
        return {
          sourceId: id,
          sourceName: 'UNKNOWN SOURCE ID',
          sourceTid: '',
          targetId: id,
          targetName: '',
          status: 'UNKNOWN SOURCE ID'
        };
      }

      if (!targetDb ||
          !targetDb[category] ||
          typeof targetDb[category] !== 'object') {
        return {
          sourceId: id,
          sourceName: source.name || 'Unnamed object',
          sourceTid: source.tid || '',
          targetId: id,
          targetName: '',
          status: 'TARGET DATABASE UNAVAILABLE'
        };
      }

      // Discard malformed database entries before matching.
      const candidates = Object.entries(targetDb[category]).filter(
        ([targetId, item]) =>
          /^\d+$/.test(targetId) &&
          item !== null &&
          typeof item === 'object' &&
          typeof item.name === 'string' &&
          item.name.length > 0
      );

      if (!canRemap) {
        const sameId = getArmyObject(targetDb, category, id);

        return {
          sourceId: id,
          sourceName: source.name || 'Unnamed object',
          sourceTid: source.tid || '',
          targetId: id,
          targetName: sameId && sameId.name
            ? sameId.name
            : '',
          status: sameId
            ? 'UNCHANGED — NOT REMAPPED'
            : 'UNVERIFIED TARGET ID'
        };
      }

      // Match exact name and TID first.
      let matches = candidates.filter(([, item]) =>
        item.name === source.name &&
        !!source.tid &&
        item.tid === source.tid
      );

      if (matches.length === 1) {
        const [targetId, item] = matches[0];

        return {
          sourceId: id,
          sourceName: source.name,
          sourceTid: source.tid || '',
          targetId: Number(targetId),
          targetName: item.name,
          status: Number(targetId) === Number(id)
            ? 'MATCHED — SAME ID'
            : 'REMAPPED'
        };
      }

      // Fall back to a unique TID.
      if (source.tid) {
        matches = candidates.filter(([, item]) =>
          item.tid === source.tid
        );

        if (matches.length === 1) {
          const [targetId, item] = matches[0];

          return {
            sourceId: id,
            sourceName: source.name,
            sourceTid: source.tid,
            targetId: Number(targetId),
            targetName: item.name,
            status: Number(targetId) === Number(id)
              ? 'MATCHED — SAME ID'
              : 'REMAPPED BY TID'
          };
        }
      }

      // Last fallback: unique exact name.
      matches = candidates.filter(([, item]) =>
        item.name === source.name
      );

      if (matches.length === 1) {
        const [targetId, item] = matches[0];

        return {
          sourceId: id,
          sourceName: source.name,
          sourceTid: source.tid || '',
          targetId: Number(targetId),
          targetName: item.name,
          status: Number(targetId) === Number(id)
            ? 'MATCHED — SAME ID'
            : 'REMAPPED BY NAME'
        };
      }

      return {
        sourceId: id,
        sourceName: source.name || 'Unnamed object',
        sourceTid: source.tid || '',
        targetId: id,
        targetName: '',
        status: matches.length > 1
          ? 'AMBIGUOUS TARGET'
          : 'NO TARGET MATCH'
      };
    }

    function splitArmySections(army) {
      const matches = Array.from(army.matchAll(/[hidus]/g));
      const sections = [];

      for (let i = 0; i < matches.length; i++) {
        const marker = matches[i][0];
        const start = matches[i].index + 1;
        const end = i + 1 < matches.length
          ? matches[i + 1].index
          : army.length;

        sections.push({
          marker,
          value: army.substring(start, end)
        });
      }

      return sections;
    }

    function analyzeArmy(army, sourceGame, targetServer) {
      const targetGame = targetServer === 'ultimate'
        ? 'ultimate'
        : 'atrasisOriginal';

      const sourceDb = ARMY_DATABASES[sourceGame] || null;
      const targetDb = ARMY_DATABASES[targetGame] || null;

      const canRemap = !!(
        sourceDb &&
        targetDb &&
        sourceGame !== targetGame
      );

      const warnings = [];
      const rows = [];

      if (!sourceDb) {
        warnings.push(
          'No verified database is loaded for this source game. IDs are preserved.'
        );
      }

      if (!targetDb) {
        warnings.push(
          'Atrasis Original database has not been extracted. IDs are preserved; compatibility is unverified.'
        );
      }

      if (sourceDb && targetDb && sourceGame === targetGame) {
        warnings.push(
          'Source and target are the same database. No ID remapping is necessary.'
        );
      }

      if (sourceDb && targetDb && !canRemap && sourceGame !== targetGame) {
        warnings.push('Remapping is disabled for this source/target combination.');
      }

      function resolve(category, id, section, quantity, displayCategory) {
        const result = mapArmyObject(
          category,
          id,
          sourceDb,
          targetDb,
          canRemap
        );

        rows.push({
          ...result,
          category: displayCategory,
          section,
          quantity
        });

        return result.targetId;
      }

      function processHeroSegment(segment) {
        const match = segment.match(
          /^(\d+)(?:m(\d+))?(?:p(\d+))?(?:e(\d+(?:_\d+)*))?$/
        );

        if (!match) {
          warnings.push('Could not parse hero segment: ' + segment);
          return segment;
        }

        const heroId = Number(match[1]);
        const mode = match[2];
        const petId = match[3];
        const equipmentIds = match[4];

        let output = String(
          resolve('heroes', heroId, 'Heroes', null, 'Hero')
        );

        if (mode !== undefined) {
          output += 'm' + mode;
        }

        if (petId !== undefined) {
          output += 'p' + resolve(
            'pets',
            Number(petId),
            'Pets',
            null,
            'Pet'
          );
        }

        if (equipmentIds !== undefined) {
          const mappedEquipment = equipmentIds.split('_').map(rawId =>
            resolve(
              'equipment',
              Number(rawId),
              'Hero equipment',
              null,
              'Equipment'
            )
          );

          output += 'e' + mappedEquipment.join('_');
        }

        return output;
      }

      function processItemSection(marker, value) {
        const category = marker === 'i' || marker === 'u'
          ? 'troops'
          : 'spells';

        const title = marker === 'i'
          ? 'Clan Castle troops'
          : marker === 'd'
            ? 'Clan Castle spells'
            : marker === 'u'
              ? 'Main army troops'
              : 'Main army spells';

        return value.split('-').map(part => {
          if (!part) return part;

          const match = part.match(/^(\d+)x(\d+)$/);

          if (!match) {
            warnings.push('Could not parse item: ' + part);
            return part;
          }

          const quantity = Number(match[1]);
          const id = Number(match[2]);

          const mappedId = resolve(
            category,
            id,
            title,
            quantity,
            category === 'troops' ? 'Troop' : 'Spell'
          );

          return quantity + 'x' + mappedId;
        }).join('-');
      }

      const sections = splitArmySections(army);

      if (!sections.length) {
        warnings.push('No recognizable army sections found.');
      }

      const outputArmy = sections.map(section => {
        let value = section.value;

        if (section.marker === 'h') {
          value = value.split('-').map(processHeroSegment).join('-');
        } else {
          value = processItemSection(section.marker, value);
        }

        return section.marker + value;
      }).join('');

      const unresolved = rows.filter(row =>
        row.status.startsWith('UNKNOWN') ||
        row.status.startsWith('NO TARGET') ||
        row.status.startsWith('AMBIGUOUS') ||
        row.status.startsWith('TARGET DATABASE')
      );

      if (unresolved.length) {
        warnings.push(
          unresolved.length +
          ' army object(s) could not be confidently mapped. Their original IDs were preserved.'
        );
      }

      return {
        sourceGame,
        targetGame,
        sourceVersion: sourceDb?.version || 'unknown',
        targetVersion: targetDb?.version || 'not loaded',
        originalArmy: army,
        outputArmy,
        rows,
        warnings,
        remappedCount: rows.filter(row =>
          row.status.startsWith('REMAPPED')
        ).length
      };
    }

    function buildOutputUrl(parsed, server) {
      const base = `https://link.${server}.atrasis.cc/en`;

      lastArmyAnalysis = null;

      if (parsed.type === 'army') {
        lastArmyAnalysis = analyzeArmy(
          parsed.army,
          parsed.sourceGame || 'unknown',
          server
        );

        return `${base}?action=CopyArmy&army=${encodeURIComponent(
          lastArmyAnalysis.outputArmy
        )}`;
      }

      if (parsed.type === 'layout') {
        const p = new URLSearchParams();
        p.set('action', 'OpenLayout');
        p.set('id', parsed.id);

        for (const k in parsed.extras) {
          p.set(k, parsed.extras[k]);
        }

        return `${base}?${p.toString()}`;
      }

      return null;
    }

    function renderArmyDebug(army) {
      const dbg = document.getElementById('armyDebug');
      const analysis = lastArmyAnalysis;

      if (!analysis) {
        dbg.classList.add('hidden');
        return;
      }

      const gameNames = {
        coc: 'Original Clash of Clans',
        ultimate: 'Atrasis Ultimate',
        atrasisOriginal: 'Atrasis Original',
        unknown: 'Unknown source'
      };

      const rowsHtml = analysis.rows.map(row => {
        const good = /^(MATCHED|REMAPPED|UNCHANGED)/.test(row.status);
        const cls = good ? 'army-status-good' : 'army-status-warn';

        const quantity = row.quantity === null
          ? '—'
          : `×${row.quantity}`;

        const source = `${escapeArmyHtml(row.sourceName)} (#${row.sourceId})`;

        const destinationName = row.targetName
          ? escapeArmyHtml(row.targetName)
          : 'Unresolved';

        const destination = `${destinationName} (#${row.targetId})`;

        return `
          <tr>
            <td>${escapeArmyHtml(row.section)}</td>
            <td>${quantity}</td>
            <td>${source}</td>
            <td>${destination}</td>
            <td class="${cls}">${escapeArmyHtml(row.status)}</td>
          </tr>`;
      }).join('');

      const warningHtml = analysis.warnings.length
        ? `<div class="army-warnings"><b>Warnings</b><ul>${
            analysis.warnings.map(w =>
              `<li>${escapeArmyHtml(w)}</li>`
            ).join('')
          }</ul></div>`
        : `<div class="army-success">All parsed objects were mapped or recognized.</div>`;

      dbg.innerHTML = `
        <div class="army-report">
          <h4>Army interpretation &amp; ID remapping</h4>

          <div class="army-meta">
            <div><b>Source:</b> ${escapeArmyHtml(gameNames[analysis.sourceGame] || analysis.sourceGame)}</div>
            <div><b>Source asset version:</b> ${escapeArmyHtml(analysis.sourceVersion)}</div>
            <div><b>Destination:</b> ${escapeArmyHtml(gameNames[analysis.targetGame] || analysis.targetGame)}</div>
            <div><b>Destination asset version:</b> ${escapeArmyHtml(analysis.targetVersion)}</div>
            <div><b>IDs remapped:</b> ${analysis.remappedCount}</div>
            <div><b>Objects parsed:</b> ${analysis.rows.length}</div>
          </div>

          ${warningHtml}

          <div class="army-table-wrap">
            <table class="army-table">
              <thead>
                <tr>
                  <th>Section</th>
                  <th>Qty</th>
                  <th>Source object / ID</th>
                  <th>Destination object / ID</th>
                  <th>Mapping</th>
                </tr>
              </thead>
              <tbody>
                ${rowsHtml || '<tr><td colspan="5">No army objects parsed.</td></tr>'}
              </tbody>
            </table>
          </div>

          <details>
            <summary>Original army code</summary>
            <code>${escapeArmyHtml(analysis.originalArmy)}</code>
          </details>

          <details>
            <summary>Generated army code</summary>
            <code>${escapeArmyHtml(analysis.outputArmy)}</code>
          </details>
        </div>
      `;

      dbg.classList.remove('hidden');
    }


    function convert() {
      const raw = document.getElementById('inputUrl').value;
      const outputSec = document.getElementById('outputSection');
      const outputBox = document.getElementById('outputUrl');
      const openBtn = document.getElementById('openBtn');
      const typeBadge = document.getElementById('linkType');
      const copyCodeBtn = document.getElementById('copyCodeBtn');
      const dbg = document.getElementById('armyDebug');

      if (!raw.trim()) {
        outputSec.classList.add('hidden');
        return;
      }

      const parsed = parseLink(raw);

      if (parsed.error) {
        outputSec.classList.remove('hidden');
        typeBadge.textContent = 'Invalid Link Format';
        typeBadge.classList.remove('warn');
        outputBox.value = parsed.error;
        openBtn.style.pointerEvents = 'none';
        openBtn.style.opacity = '0.5';
        copyCodeBtn.classList.add('hidden');
        dbg.classList.add('hidden');
        return;
      }

      const converted = buildOutputUrl(parsed, targetServer);
      if (!converted) {
        outputSec.classList.remove('hidden');
        typeBadge.textContent = 'Unsupported action: ' + parsed.action;
        outputBox.value = 'This action type is not supported.';
        openBtn.style.pointerEvents = 'none';
        openBtn.style.opacity = '0.5';
        copyCodeBtn.classList.add('hidden');
        dbg.classList.add('hidden');
        return;
      }

      if (parsed.type === 'army') {
        typeBadge.textContent = 'Detected: Army Composition';
        copyCodeBtn.classList.remove('hidden');
        renderArmyDebug(parsed.army);
      } else if (parsed.type === 'layout') {
        typeBadge.textContent = 'Detected: Base Layout';
        copyCodeBtn.classList.add('hidden');
        dbg.classList.add('hidden');
      } else {
        typeBadge.textContent = 'Detected: Game Link (' + parsed.action + ')';
        copyCodeBtn.classList.add('hidden');
        dbg.classList.add('hidden');
      }

      outputBox.value = converted;
      openBtn.href = converted;
      openBtn.style.pointerEvents = 'auto';
      openBtn.style.opacity = '1';
      outputSec.classList.remove('hidden');
    }

    async function pasteClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        document.getElementById('inputUrl').value = text;
        convert();
      } catch (e) {
        alert('Tap the input box and paste manually (clipboard permission blocked).');
      }
    }

    async function copyText(text, btn, okMsg, failMsg, resetText) {
      const ok = await copyToClipboard(text);
      flashButton(btn, ok ? okMsg : failMsg, resetText, ok);
    }

    function copyResult() {
      const outputBox = document.getElementById('outputUrl');
      const copyBtn = document.getElementById('copyBtn');
      const link = outputBox.value;
      if (!link || link.startsWith('Could not find') || link.startsWith('No ') || link.startsWith('This action') || link.startsWith('Malformed')) {
        flashButton(copyBtn, 'Nothing to copy', 'Copy Link');
        return;
      }
      copyText(link, copyBtn, 'Copied!', 'Copy failed', 'Copy Link');
    }

    function copyArmyCode() {
      const copyBtn = document.getElementById('copyCodeBtn');
      const parsed = parseLink(document.getElementById('inputUrl').value);
      if (parsed.type !== 'army' || !parsed.army) {
        flashButton(copyBtn, 'No army code', 'Copy Army Code');
        return;
      }
      copyText(parsed.army, copyBtn, 'Copied code!', 'Copy failed', 'Copy Army Code');
    }

    // Modern async Clipboard API with a legacy execCommand fallback for
    // non-secure contexts (file://, http://) where navigator.clipboard is
    // blocked or undefined.
    function copyToClipboard(text) {
      return new Promise(async (resolve) => {
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
            resolve(true);
            return;
          }
        } catch (e) {
          // fall through to legacy method
        }
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.top = '0';
          ta.style.left = '0';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          const done = document.execCommand('copy');
          document.body.removeChild(ta);
          resolve(done);
        } catch (e) {
          resolve(false);
        }
      });
    }

    function flashButton(btn, message, resetText, isError) {
      btn.textContent = message;
      if (isError === true) {
        btn.style.background = 'var(--danger)';
      } else if (isError === false) {
        btn.style.background = 'var(--success)';
      }
      clearTimeout(btn._resetTimer);
      btn._resetTimer = setTimeout(() => {
        btn.textContent = resetText;
        btn.style.background = '';
      }, 1500);
    }

    function clearAll() {
      document.getElementById('inputUrl').value = '';
      convert();
    }
  </script>
</body>
