<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atrasis Link Converter</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #10b981;
      --warn: #f59e0b;
      --danger: #ef4444;
      --border: #334155;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    h1 { font-size: 1.25rem; margin: 0 0 6px; }
    p.sub { color: var(--muted); font-size: 0.85rem; margin: 0 0 18px; }
    .server-toggle {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .server-toggle button {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--muted);
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .server-toggle button.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
    textarea {
      width: 100%;
      height: 88px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      font-size: 0.85rem;
      resize: none;
      margin-bottom: 12px;
      word-break: break-all;
    }
    textarea:focus { outline: none; border-color: var(--accent); }
    .btn-row { display: flex; gap: 10px; margin-bottom: 16px; }
    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: inline-block;
    }
    .btn-secondary { background: #334155; color: #fff; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-success { background: var(--success); color: #064e3b; }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 6px;
      background: #334155;
      color: #e2e8f0;
      margin-bottom: 8px;
    }
    .badge.warn { background: var(--warn); color: #1f1300; }
    .hidden { display: none; }
    .debug {
      margin-top: 14px;
      padding: 12px;
      border: 1px dashed var(--border);
      border-radius: 10px;
      background: rgba(15,23,42,0.6);
      font-size: 0.78rem;
      color: var(--muted);
      word-break: break-all;
    }
    .debug h4 { margin: 0 0 8px; color: var(--text); font-size: 0.8rem; font-weight: 600; }
    .debug code {
      display: block;
      color: #e2e8f0;
      background: var(--bg);
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 8px;
      word-break: break-all;
      white-space: pre-wrap;
    }
    .id-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .id-chip {
      font-size: 0.72rem;
      padding: 2px 7px;
      border-radius: 5px;
      background: #334155;
      color: #e2e8f0;
    }
    .id-chip.warn { background: var(--danger); color: #fff; }
    .hint {
      margin-top: 10px;
      font-size: 0.78rem;
      color: var(--warn);
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Atrasis Link Converter</h1>
    <p class="sub">Supports Base Layouts &amp; Army Compositions</p>

    <div class="server-toggle">
      <button id="btnUltimate" class="active" onclick="setServer('ultimate')">Atrasis Ultimate</button>
      <button id="btnOriginal" onclick="setServer('original')">Atrasis Original</button>
    </div>

    <label for="inputUrl">Paste Clash of Clans Link</label>
    <textarea id="inputUrl" placeholder="clashofclans://action=CopyArmy&army=... or https://link.clashofclans.com/..." oninput="convert()"></textarea>

    <div class="btn-row">
      <button class="btn btn-secondary" onclick="pasteClipboard()">Paste</button>
      <button class="btn btn-secondary" onclick="clearAll()">Clear</button>
    </div>

    <div id="outputSection" class="hidden">
      <span id="linkType" class="badge">Detected: Link</span>
      <label for="outputUrl">Converted Atrasis Link</label>
      <textarea id="outputUrl" readonly></textarea>
      <div class="btn-row">
        <button id="copyBtn" class="btn btn-secondary" onclick="copyResult()">Copy Link</button>
        <button id="copyCodeBtn" class="btn btn-secondary hidden" onclick="copyArmyCode()">Copy Army Code</button>
        <a id="openBtn" class="btn btn-success" href="#" target="_self">Open in Atrasis</a>
      </div>
      <div id="armyDebug" class="debug hidden"></div>
    </div>
  </div>

  <script>
    let targetServer = 'ultimate';

    // These IDs are taken from a genuine working Atrasis Ultimate army link.
    // If a converted CoC army uses IDs outside this set, Atrasis will usually
    // reject it as "invalid army" because the troop/spell doesn't exist in
    // its game version.
    const KNOWN_ATRASIS_IDS = new Set([
      1, 2, 5, 8, 9, 10, 57, 63, 65, 70, 76, 98, 99, 109, 123, 143, 204
    ]);

    function setServer(server) {
      targetServer = server;
      document.getElementById('btnUltimate').classList.toggle('active', server === 'ultimate');
      document.getElementById('btnOriginal').classList.toggle('active', server === 'original');
      convert();
    }

    // Strip zero-width chars, NBSP, newlines, tabs, and stray control chars
    // that chat apps / word processors love to insert when copying.
    function sanitizeInput(s) {
      return s
        .replace(/[\u200B-\u200D\uFEFF\u00A0]/g, '')
        .replace(/[\r\n\t]+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function parseLink(raw) {
      const cleaned = sanitizeInput(raw);
      const actionIdx = cleaned.indexOf('action=');
      if (actionIdx === -1) return { error: 'No "action=" found in the pasted text.' };

      // Take everything from action= onwards, drop URL fragments.
      let q = cleaned.substring(actionIdx);
      const hashIdx = q.indexOf('#');
      if (hashIdx !== -1) q = q.substring(0, hashIdx);

      // Strip any trailing junk after the query (e.g. whitespace, stray text).
      // The query string only contains [A-Za-z0-9&_=%-].
      q = q.match(/^[A-Za-z0-9&_=%\-]+/);
      if (!q) return { error: 'Could not parse the query string.' };
      q = q[0];

      let params;
      try {
        params = new URLSearchParams(q);
      } catch (e) {
        return { error: 'Malformed query string.' };
      }

      const action = params.get('action');
      if (!action) return { error: 'No action parameter found.' };

      if (action === 'CopyArmy') {
        const army = (params.get('army') || '').trim();
        if (!army) return { error: 'CopyArmy link has no army parameter.' };
        // Army codes only use [A-Za-z0-9_-]. Strip anything else defensively.
        const cleanArmy = army.replace(/[^A-Za-z0-9_\-]/g, '');
        return { action: 'CopyArmy', army: cleanArmy, type: 'army' };
      }

      if (action === 'OpenLayout') {
        const id = params.get('id');
        if (!id) return { error: 'OpenLayout link has no id parameter.' };
        // Preserve any other layout params (title, etc.).
        const extras = {};
        for (const [k, v] of params.entries()) {
          if (k !== 'action' && k !== 'id') extras[k] = v;
        }
        return { action: 'OpenLayout', id, extras, type: 'layout' };
      }

      return { action, type: 'unknown', params };
    }

    function buildOutputUrl(parsed, server) {
      const base = `https://link.${server}.atrasis.cc/en`;
      if (parsed.type === 'army') {
        return `${base}?action=CopyArmy&army=${parsed.army}`;
      }
      if (parsed.type === 'layout') {
        const p = new URLSearchParams();
        p.set('action', 'OpenLayout');
        p.set('id', parsed.id);
        for (const k in parsed.extras) p.set(k, parsed.extras[k]);
        return `${base}?${p.toString()}`;
      }
      return null;
    }

    function extractArmyIds(army) {
      const matches = army.match(/x(\d+)/g) || [];
      const ids = [...new Set(matches.map(m => parseInt(m.slice(1), 10)))];
      ids.sort((a, b) => a - b);
      return ids;
    }

    function renderArmyDebug(army) {
      const ids = extractArmyIds(army);
      const unknown = ids.filter(id => !KNOWN_ATRASIS_IDS.has(id));
      const dbg = document.getElementById('armyDebug');
      const chips = ids.map(id => {
        const cls = KNOWN_ATRASIS_IDS.has(id) ? 'id-chip' : 'id-chip warn';
        return `<span class="${cls}">${id}</span>`;
      }).join('');
      let hint = '';
      if (unknown.length) {
        hint = `<div class="hint">Heads up: Atrasis's game version likely doesn't recognize troop/spell IDs <b>${unknown.join(', ')}</b>. That's almost certainly why it says "invalid army". The converter sent the right URL &mdash; the army code itself is incompatible with Atrasis's version. Try rebuilding the army inside Atrasis, or switch to Atrasis Ultimate (newer version).</div>`;
      }
      dbg.innerHTML =
        `<h4>Extracted army code</h4>` +
        `<code>${army}</code>` +
        `<div style="margin-bottom:6px;">Troop / spell IDs in this army:</div>` +
        `<div class="id-list">${chips}</div>` +
        hint;
      dbg.classList.remove('hidden');
    }

    function convert() {
      const raw = document.getElementById('inputUrl').value;
      const outputSec = document.getElementById('outputSection');
      const outputBox = document.getElementById('outputUrl');
      const openBtn = document.getElementById('openBtn');
      const typeBadge = document.getElementById('linkType');
      const copyCodeBtn = document.getElementById('copyCodeBtn');
      const dbg = document.getElementById('armyDebug');

      if (!raw.trim()) {
        outputSec.classList.add('hidden');
        return;
      }

      const parsed = parseLink(raw);

      if (parsed.error) {
        outputSec.classList.remove('hidden');
        typeBadge.textContent = 'Invalid Link Format';
        typeBadge.classList.remove('warn');
        outputBox.value = parsed.error;
        openBtn.style.pointerEvents = 'none';
        openBtn.style.opacity = '0.5';
        copyCodeBtn.classList.add('hidden');
        dbg.classList.add('hidden');
        return;
      }

      const converted = buildOutputUrl(parsed, targetServer);
      if (!converted) {
        outputSec.classList.remove('hidden');
        typeBadge.textContent = 'Unsupported action: ' + parsed.action;
        outputBox.value = 'This action type is not supported.';
        openBtn.style.pointerEvents = 'none';
        openBtn.style.opacity = '0.5';
        copyCodeBtn.classList.add('hidden');
        dbg.classList.add('hidden');
        return;
      }

      if (parsed.type === 'army') {
        typeBadge.textContent = 'Detected: Army Composition';
        copyCodeBtn.classList.remove('hidden');
        renderArmyDebug(parsed.army);
      } else if (parsed.type === 'layout') {
        typeBadge.textContent = 'Detected: Base Layout';
        copyCodeBtn.classList.add('hidden');
        dbg.classList.add('hidden');
      } else {
        typeBadge.textContent = 'Detected: Game Link (' + parsed.action + ')';
        copyCodeBtn.classList.add('hidden');
        dbg.classList.add('hidden');
      }

      outputBox.value = converted;
      openBtn.href = converted;
      openBtn.style.pointerEvents = 'auto';
      openBtn.style.opacity = '1';
      outputSec.classList.remove('hidden');
    }

    async function pasteClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        document.getElementById('inputUrl').value = text;
        convert();
      } catch (e) {
        alert('Tap the input box and paste manually (clipboard permission blocked).');
      }
    }

    async function copyText(text, btn, okMsg, failMsg, resetText) {
      const ok = await copyToClipboard(text);
      flashButton(btn, ok ? okMsg : failMsg, resetText, ok);
    }

    function copyResult() {
      const outputBox = document.getElementById('outputUrl');
      const copyBtn = document.getElementById('copyBtn');
      const link = outputBox.value;
      if (!link || link.startsWith('Could not find') || link.startsWith('No ') || link.startsWith('This action') || link.startsWith('Malformed')) {
        flashButton(copyBtn, 'Nothing to copy', 'Copy Link');
        return;
      }
      copyText(link, copyBtn, 'Copied!', 'Copy failed', 'Copy Link');
    }

    function copyArmyCode() {
      const copyBtn = document.getElementById('copyCodeBtn');
      const parsed = parseLink(document.getElementById('inputUrl').value);
      if (parsed.type !== 'army' || !parsed.army) {
        flashButton(copyBtn, 'No army code', 'Copy Army Code');
        return;
      }
      copyText(parsed.army, copyBtn, 'Copied code!', 'Copy failed', 'Copy Army Code');
    }

    // Modern async Clipboard API with a legacy execCommand fallback for
    // non-secure contexts (file://, http://) where navigator.clipboard is
    // blocked or undefined.
    function copyToClipboard(text) {
      return new Promise(async (resolve) => {
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
            resolve(true);
            return;
          }
        } catch (e) {
          // fall through to legacy method
        }
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.top = '0';
          ta.style.left = '0';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          const done = document.execCommand('copy');
          document.body.removeChild(ta);
          resolve(done);
        } catch (e) {
          resolve(false);
        }
      });
    }

    function flashButton(btn, message, resetText, isError) {
      btn.textContent = message;
      if (isError === true) {
        btn.style.background = 'var(--danger)';
      } else if (isError === false) {
        btn.style.background = 'var(--success)';
      }
      clearTimeout(btn._resetTimer);
      btn._resetTimer = setTimeout(() => {
        btn.textContent = resetText;
        btn.style.background = '';
      }, 1500);
    }

    function clearAll() {
      document.getElementById('inputUrl').value = '';
      convert();
    }
  </script>
</body>
</html>
